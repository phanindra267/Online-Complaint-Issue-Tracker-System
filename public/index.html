<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container animate-fade-in">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Issue<span style="color: white">Tracker</span></h1>
            <a href="admin.html" class="nav-link">Admin Login</a>
        </header>

        <div class="glass-panel" style="max-width: 600px; margin: 0 auto; padding: 2.5rem;">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Submit a Complaint</h2>
            <form id="complaintForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                
                <div class="form-group">
                    <label for="text">Describe your issue</label>
                    <textarea id="text" rows="5" required placeholder="Please describe the problem you are facing..."></textarea>
                </div>
                
                <button type="submit" id="submitBtn">
                    <span>Submit Complaint</span>
                </button>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
